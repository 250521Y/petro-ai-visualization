<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">产量智能预测 第5步 递归多步预测</title><desc id="guide-desc">输入预测起点之前的历史，把上一步预测追加为新滞后，得到1至多步的未来预测序列。这是流程指导示意，不是当前计算结果。</desc><rect width="960" height="340" rx="10" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="24" y="32" font-size="21" fill="#293b3b" text-anchor="start" font-weight="600">05  递归多步预测</text><rect x="18" y="50" width="288" height="260" rx="8" fill="#f3f8f5" stroke="#dce5e8"/><text x="34" y="77" font-size="17" fill="#237762" text-anchor="start" font-weight="600">准备输入</text><text x="34" y="103" font-size="16" fill="#293b3b" text-anchor="start">预测起点之前的历史</text><g transform="translate(42,146)"><line x1="10" y1="5" x2="10" y2="120" stroke="#b8c6c9" stroke-width="2"/><line x1="10" y1="120" x2="236" y2="120" stroke="#b8c6c9" stroke-width="2"/><path d="M12.0,92.0 L20.4,79.0 L28.8,68.1 L37.2,61.0 L45.6,59.0 L54.0,62.1 L62.4,69.7 L70.8,80.4 L79.2,92.1 L87.6,102.7 L96.0,110.1 L104.4,113.1 L112.8,110.8 L121.2,103.6 L129.6,92.6 L138.0,79.5 L146.4,66.5 L154.8,55.7 L163.2,48.9 L171.6,47.0 L180.0,50.4 L188.4,58.1 L196.8,68.9 L205.2,80.6 L213.6,91.1 L222.0,98.4" fill="none" stroke="#237762" stroke-width="3"/></g><path d="M310.0,176.0 L328.0,176.0 L322.0,170.0 L328.0,176.0 L322.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="336" y="50" width="288" height="260" rx="8" fill="#f2f6fc" stroke="#dce5e8"/><text x="352" y="77" font-size="17" fill="#4267a8" text-anchor="start" font-weight="600">执行本步</text><text x="352" y="103" font-size="16" fill="#293b3b" text-anchor="start">把上一步预测追加为新滞后</text><g transform="translate(360,146)"><line x1="10" y1="5" x2="10" y2="120" stroke="#b8c6c9" stroke-width="2"/><line x1="10" y1="120" x2="236" y2="120" stroke="#b8c6c9" stroke-width="2"/><path d="M12.0,92.0 L20.4,79.0 L28.8,68.1 L37.2,61.0 L45.6,59.0 L54.0,62.1 L62.4,69.7 L70.8,80.4 L79.2,92.1 L87.6,102.7 L96.0,110.1 L104.4,113.1 L112.8,110.8 L121.2,103.6 L129.6,92.6 L138.0,79.5 L146.4,66.5 L154.8,55.7 L163.2,48.9 L171.6,47.0 L180.0,50.4 L188.4,58.1 L196.8,68.9 L205.2,80.6 L213.6,91.1 L222.0,98.4" fill="none" stroke="#237762" stroke-width="3"/><line x1="155" y1="5" x2="155" y2="120" stroke="#b46547" stroke-width="2" stroke-dasharray="4 4"/><text x="160" y="16" font-size="13" fill="#b46547" text-anchor="start">预测</text><text x="22" y="143" font-size="14" fill="#4267a8" text-anchor="start">预测 → 追加 → 再预测</text></g><path d="M628.0,176.0 L646.0,176.0 L640.0,170.0 L646.0,176.0 L640.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="654" y="50" width="288" height="260" rx="8" fill="#faf6f0" stroke="#dce5e8"/><text x="670" y="77" font-size="17" fill="#b46547" text-anchor="start" font-weight="600">核对产出</text><text x="670" y="103" font-size="16" fill="#293b3b" text-anchor="start">1至多步的未来预测序列</text><g transform="translate(678,146)"><line x1="10" y1="5" x2="10" y2="120" stroke="#b8c6c9" stroke-width="2"/><line x1="10" y1="120" x2="236" y2="120" stroke="#b8c6c9" stroke-width="2"/><path d="M12.0,92.0 L20.4,79.0 L28.8,68.1 L37.2,61.0 L45.6,59.0 L54.0,62.1 L62.4,69.7 L70.8,80.4 L79.2,92.1 L87.6,102.7 L96.0,110.1 L104.4,113.1 L112.8,110.8 L121.2,103.6 L129.6,92.6 L138.0,79.5 L146.4,66.5 L154.8,55.7 L163.2,48.9 L171.6,47.0 L180.0,50.4 L188.4,58.1 L196.8,68.9 L205.2,80.6 L213.6,91.1 L222.0,98.4" fill="none" stroke="#237762" stroke-width="3"/></g><text x="24" y="331" font-size="13" fill="#61777b" text-anchor="start">流程示意 · 图形与示例数值不代表当前运行结果；实时结果请在交互实验中查看</text></g></svg>