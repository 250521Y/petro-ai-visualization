<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">射孔孔道形态预测 第4步 归一化距离权重</title><desc id="guide-desc">输入k个近邻的距离，逆距离归一化，得到合计为1的近邻权重。这是流程指导示意，不是当前计算结果。</desc><rect width="960" height="340" rx="10" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="24" y="32" font-size="21" fill="#293b3b" text-anchor="start" font-weight="600">04  归一化距离权重</text><rect x="18" y="50" width="288" height="260" rx="8" fill="#f3f8f5" stroke="#dce5e8"/><text x="34" y="77" font-size="17" fill="#237762" text-anchor="start" font-weight="600">准备输入</text><text x="34" y="103" font-size="16" fill="#293b3b" text-anchor="start">k个近邻的距离</text><g transform="translate(42,146)"><text x="0" y="24" font-size="14" fill="#293b3b" text-anchor="start">近邻1 d</text><rect x="64" y="9" width="52.5" height="18" rx="5" fill="#237762"/><text x="218" y="24" font-size="13" fill="#293b3b" text-anchor="start"></text><text x="0" y="59" font-size="14" fill="#293b3b" text-anchor="start">近邻2 d</text><rect x="64" y="44" width="90.0" height="18" rx="5" fill="#237762"/><text x="218" y="59" font-size="13" fill="#293b3b" text-anchor="start"></text><text x="0" y="94" font-size="14" fill="#293b3b" text-anchor="start">近邻3 d</text><rect x="64" y="79" width="135.0" height="18" rx="5" fill="#237762"/><text x="218" y="94" font-size="13" fill="#293b3b" text-anchor="start"></text><text x="12" y="143" font-size="14" fill="#61777b" text-anchor="start">标准化空间中的距离</text></g><path d="M310.0,176.0 L328.0,176.0 L322.0,170.0 L328.0,176.0 L322.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="336" y="50" width="288" height="260" rx="8" fill="#f2f6fc" stroke="#dce5e8"/><text x="352" y="77" font-size="17" fill="#4267a8" text-anchor="start" font-weight="600">执行本步</text><text x="352" y="103" font-size="16" fill="#293b3b" text-anchor="start">逆距离归一化</text><g transform="translate(360,146)"><text x="112" y="37" font-size="18" fill="#4267a8" text-anchor="middle">距离 d → 逆距离 1/d</text><text x="112" y="77" font-size="17" fill="#293b3b" text-anchor="middle">再除以全部逆距离之和</text><text x="112" y="118" font-size="20" fill="#237762" text-anchor="middle" font-weight="600">权重和 = 1</text></g><path d="M628.0,176.0 L646.0,176.0 L640.0,170.0 L646.0,176.0 L640.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="654" y="50" width="288" height="260" rx="8" fill="#faf6f0" stroke="#dce5e8"/><text x="670" y="77" font-size="17" fill="#b46547" text-anchor="start" font-weight="600">核对产出</text><text x="670" y="103" font-size="16" fill="#293b3b" text-anchor="start">合计为1的近邻权重</text><g transform="translate(678,146)"><text x="12" y="143" font-size="14" fill="#4267a8" text-anchor="start">示意权重合计 100%</text><text x="0" y="24" font-size="14" fill="#293b3b" text-anchor="start">近邻1</text><rect x="64" y="9" width="75.0" height="18" rx="5" fill="#237762"/><text x="218" y="24" font-size="13" fill="#293b3b" text-anchor="start"></text><text x="0" y="59" font-size="14" fill="#293b3b" text-anchor="start">近邻2</text><rect x="64" y="44" width="45.0" height="18" rx="5" fill="#237762"/><text x="218" y="59" font-size="13" fill="#293b3b" text-anchor="start"></text><text x="0" y="94" font-size="14" fill="#293b3b" text-anchor="start">近邻3</text><rect x="64" y="79" width="30.0" height="18" rx="5" fill="#237762"/><text x="218" y="94" font-size="13" fill="#293b3b" text-anchor="start"></text></g><text x="24" y="331" font-size="13" fill="#61777b" text-anchor="start">流程示意 · 图形与示例数值不代表当前运行结果；实时结果请在交互实验中查看</text></g></svg>