<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">测井数据智能修复 第4步 跨井拟合与验证</title><desc id="guide-desc">输入六口独立合成井，3井拟合、1井选λ、再拟合4井，得到未见测试井上的回归模型。这是流程指导示意，不是当前计算结果。</desc><rect width="960" height="340" rx="10" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="24" y="32" font-size="21" fill="#293b3b" text-anchor="start" font-weight="600">04  跨井拟合与验证</text><rect x="18" y="50" width="288" height="260" rx="8" fill="#f3f8f5" stroke="#dce5e8"/><text x="34" y="77" font-size="17" fill="#237762" text-anchor="start" font-weight="600">准备输入</text><text x="34" y="103" font-size="16" fill="#293b3b" text-anchor="start">六口独立合成井</text><g transform="translate(42,146)"><line x1="16" y1="5" x2="16" y2="132" stroke="#b8c6c9" stroke-width="2"/><text x="2" y="17" font-size="12" fill="#61777b" text-anchor="start">深</text><path d="M40.0,8.0 L48.6,14.0 L55.1,20.0 L58.0,26.0 L56.4,32.0 L50.8,38.0 L42.5,44.0 L33.7,50.0 L26.4,56.0 L22.4,62.0 L22.7,68.0 L27.3,74.0 L35.0,80.0 L43.9,86.0 L51.8,92.0 L56.9,98.0 L57.8,104.0 L54.4,110.0 L47.4,116.0 L38.6,122.0 L30.2,128.0" fill="none" stroke="#237762" stroke-width="3"/><path d="M125.1,8.0 L128.0,14.0 L126.4,20.0 L120.8,26.0 L112.5,32.0 L103.7,38.0 L96.4,44.0 L92.4,50.0 L92.7,56.0 L97.3,62.0 L105.0,68.0 L113.9,74.0 L121.8,80.0 L126.9,86.0 L127.8,92.0 L124.4,98.0 L117.4,104.0 L108.6,110.0 L100.2,116.0 L94.2,122.0 L92.0,128.0" fill="none" stroke="#4267a8" stroke-width="3"/><path d="M196.4,8.0 L190.8,14.0 L182.5,20.0 L173.7,26.0 L166.4,32.0 L162.4,38.0 L162.7,44.0 L167.3,50.0 L175.0,56.0 L183.9,62.0 L191.8,68.0 L196.9,74.0 L197.8,80.0 L194.4,86.0 L187.4,92.0 L178.6,98.0 L170.2,104.0 L164.2,110.0 L162.0,116.0 L164.2,122.0 L170.3,128.0" fill="none" stroke="#765497" stroke-width="3"/></g><path d="M310.0,176.0 L328.0,176.0 L322.0,170.0 L328.0,176.0 L322.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="336" y="50"