<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">修井作业方案智能推荐 第4步 归一化查询向量</title><desc id="guide-desc">输入命中词的TF与IDF，形成并归一化查询向量，得到可用于余弦比较的向量。这是流程指导示意，不是当前计算结果。</desc><rect width="960" height="340" rx="10" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="24" y="32" font-size="21" fill="#293b3b" text-anchor="start" font-weight="600">04  归一化查询向量</text><rect x="18" y="50" width="288" height="260" rx="8" fill="#f3f8f5" stroke="#dce5e8"/><text x="34" y="77" font-size="17" fill="#237762" text-anchor="start" font-weight="600">准备输入</text><text x="34" y="103" font-size="16" fill="#293b3b" text-anchor="start">命中词的TF与IDF</text><g transform="translate(42,146)"><rect x="28" y="3" width="178" height="126" rx="5" fill="#fff" stroke="#dce5e8"/><rect x="45" y="20" width="145" height="9" rx="2" fill="#b8c6c9"/><rect x="45" y="45" width="120" height="9" rx="2" fill="#d9eee5"/><rect x="45" y="70" width="145" height="9" rx="2" fill="#b8c6c9"/><rect x="45" y="95" width="120" height="9" rx="2" fill="#d9eee5"/><text x="114" y="143" font-size="14" fill="#4267a8" text-anchor="middle">词项命中 / 语料权重</text></g><path d="M310.0,176.0 L328.0,176.0 L322.0,170.0 L328.0,176.0 L322.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="336" y="50" width="288" height="260" rx="8" fill="#f2f6fc" stroke="#dce5e8"/><text x="352" y="77" font-size="17" fill="#4267a8" text-anchor="start" font-weight="600">执行本步</text><text x="352" y="103" font-size="16" fill="#293b3b" text-anchor="start">形成并归一化查询向量</text><g transform="translate(360,146)"><text x="0" y="24" font-size="14" fill="#293b3b" text-anchor="start">原值A</text><rect x="64" y="9" width="142.5" height="18" rx="5" fill="#237762"/><text x="218" y="24" font-size="13" fill="#293b3b" text-anchor="start"></text><text x="0" y="59" font-size="14" fill="#293b3b" text-anchor="start">原值B</text><rect x="64" y="44" width="52.5