<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">抽油机示功图智能诊断 第2步 形状归一化</title><desc id="guide-desc">输入各张卡片的原始坐标，按本卡片范围缩放到0—1，得到可比较的闭环形状。这是流程指导示意，不是当前计算结果。</desc><rect width="960" height="340" rx="10" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="24" y="32" font-size="21" fill="#293b3b" text-anchor="start" font-weight="600">02  形状归一化</text><rect x="18" y="50" width="288" height="260" rx="8" fill="#f3f8f5" stroke="#dce5e8"/><text x="34" y="77" font-size="17" fill="#237762" text-anchor="start" font-weight="600">准备输入</text><text x="34" y="103" font-size="16" fill="#293b3b" text-anchor="start">各张卡片的原始坐标</text><g transform="translate(42,146)"><path d="M35.0,110.0 L54.0,40.0 L180.0,28.0 L205.0,90.0 L35.0,110.0" fill="none" stroke="#237762" stroke-width="3"/><circle cx="155" cy="31" r="6" fill="#b46547"/><text x="20" y="143" font-size="14" fill="#61777b" text-anchor="start">位移 →    载荷 ↑</text></g><path d="M310.0,176.0 L328.0,176.0 L322.0,170.0 L328.0,176.0 L322.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="336" y="50" width="288" height="260" rx="8" fill="#f2f6fc" stroke="#dce5e8"/><text x="352" y="77" font-size="17" fill="#4267a8" text-anchor="start" font-weight="600">执行本步</text><text x="352" y="103" font-size="16" fill="#293b3b" text-anchor="start">按本卡片范围缩放到0—1</text><g transform="translate(360,146)"><text x="0" y="24" font-size="14" fill="#293b3b" text-anchor="start">原值A</text><rect x="64" y="9" width="142.5" height="18" rx="5" fill="#237762"/><text x="218" y="24" font-size="13" fill="#293b3b" text-anchor="start"></text><text x="0" y="59" font-size="14" fill="#293b3b" text-anchor="start">原值B</text><rect x="64" y="44" width="52.5" height="18" rx="5" fill="#237762"/><text x="218" y="59" font-size="13" fill="#293b3b" text-anchor="start"></text><line x1="30" y1="80" x2="200" y2="80" stroke="#b8c6c9" stroke-width="2"/><text x="20" y="109" font-size="16" fill="#4267a8" text-anchor="start">统一尺度 / 对齐基准</text><path d="M110.0,115.0 L110.0,132.0 L175.0,132.0" fill="none" stroke="#4267a8" stroke-width="3"/></g><path d="M628.0,176.0 L646.0,176.0 L640.0,170.0 L646.0,176.0 L640.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="654" y="50" width="288" height="260" rx="8" fill="#faf6f0" stroke="#dce5e8"/><text x="670" y="77" font-size="17" fill="#b46547" text-anchor="start" font-weight="600">核对产出</text><text x="670" y="103" font-size="16" fill="#293b3b" text-anchor="start">可比较的闭环形状</text><g transform="translate(678,146)"><path d="M35.0,110.0 L54.0,40.0 L180.0,28.0 L205.0,90.0 L35.0,110.0" fill="none" stroke="#237762" stroke-width="3"/><circle cx="155" cy="31" r="6" fill="#b46547"/><text x="20" y="143" font-size="14" fill="#61777b" text-anchor="start">位移 →    载荷 ↑</text></g><text x="24" y="331" font-size="13" fill="#61777b" text-anchor="start">流程示意 · 图形与示例数值不代表当前运行结果；实时结果请在交互实验中查看</text></g></svg>