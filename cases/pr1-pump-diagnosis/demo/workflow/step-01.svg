<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">抽油机示功图智能诊断 第1步 周期采样</title><desc id="guide-desc">输入一个周期的位移与载荷，组成80对采样坐标，得到抽油周期的闭合示功图。这是流程指导示意，不是当前计算结果。</desc><rect width="960" height="340" rx="10" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="24" y="32" font-size="21" fill="#293b3b" text-anchor="start" font-weight="600">01  周期采样</text><rect x="18" y="50" width="288" height="260" rx="8" fill="#f3f8f5" stroke="#dce5e8"/><text x="34" y="77" font-size="17" fill="#237762" text-anchor="start" font-weight="600">准备输入</text><text x="34" y="103" font-size="16" fill="#293b3b" text-anchor="start">一个周期的位移与载荷</text><g transform="translate(42,146)"><path d="M35.0,110.0 L54.0,40.0 L180.0,28.0 L205.0,90.0 L35.0,110.0" fill="none" stroke="#237762" stroke-width="3"/><circle cx="155" cy="31" r="6" fill="#b46547"/><text x="20" y="143" font-size="14" fill="#61777b" text-anchor="start">位移 →    载荷 ↑</text></g><path d="M310.0,176.0 L328.0,176.0 L322.0,170.0 L328.0,176.0 L322.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="336" y="50" width="288" height="260" rx="8" fill="#f2f6fc" stroke="#dce5e8"/><text x="352" y="77" font-size="17" fill="#4267a8" text-anchor="start" font-weight="600">执行本步</text><text x="352" y="103" font-size="16" fill="#293b3b" text-anchor="start">组成80对采样坐标</text><g transform="translate(360,146)"><path d="M35.0,110.0 L54.0,40.0 L180.0,28.0 L205.0,90.0 L35.0,110.0" fill="none" stroke="#237762" stroke-width="3"/><circle cx="155" cy="31" r="6" fill="#b46547"/><text x="20" y="143" font-size="14" fill="#61777b" text-anchor="start">位移 →    载荷 ↑</text></g><path d="M628.0,176.0 L646.0,176.0 L640.0,170.0 L646.0,176.0 L640.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="654" y="50" width="288" height="260" rx="8" fill="#faf6f0" stroke="#dce5e8"/><text x="670" y="77" font-size="17" fill="#b46547" text-anchor="start" font-weight="600">核对产出</text><text x="670" y="103" font-size="16" fill="#293b3b" text-anchor="start">抽油周期的闭合示功图</text><g transform="translate(678,146)"><path d="M35.0,110.0 L54.0,40.0 L180.0,28.0 L205.0,90.0 L35.0,110.0" fill="none" stroke="#237762" stroke-width="3"/><circle cx="155" cy="31" r="6" fill="#b46547"/><text x="20" y="143" font-size="14" fill="#61777b" text-anchor="start">位移 →    载荷 ↑</text></g><text x="24" y="331" font-size="13" fill="#61777b" text-anchor="start">流程示意 · 图形与示例数值不代表当前运行结果；实时结果请在交互实验中查看</text></g></svg>