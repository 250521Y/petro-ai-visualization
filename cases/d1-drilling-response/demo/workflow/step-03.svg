<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">钻速预测与参数优选 第3步 验证选参</title><desc id="guide-desc">输入训练样本与候选λ，比较验证集误差，得到选定的正则参数。这是流程指导示意，不是当前计算结果。</desc><rect width="960" height="340" rx="10" fill="#fff"/><g font-family="Microsoft YaHei,system-ui,sans-serif"><text x="24" y="32" font-size="21" fill="#293b3b" text-anchor="start" font-weight="600">03  验证选参</text><rect x="18" y="50" width="288" height="260" rx="8" fill="#f3f8f5" stroke="#dce5e8"/><text x="34" y="77" font-size="17" fill="#237762" text-anchor="start" font-weight="600">准备输入</text><text x="34" y="103" font-size="16" fill="#293b3b" text-anchor="start">训练样本与候选λ</text><g transform="translate(42,146)"><rect x="8.0" y="30" width="70.66666666666667" height="45" rx="5" fill="#237762"/><text x="43.333333333333336" y="59" font-size="17" fill="#fff" text-anchor="middle">训练</text><text x="43.333333333333336" y="109" font-size="14" fill="#237762" text-anchor="middle">用于拟合</text><rect x="84.66666666666667" y="30" width="70.66666666666667" height="45" rx="5" fill="#4267a8"/><text x="120.0" y="59" font-size="17" fill="#fff" text-anchor="middle">验证</text><text x="120.0" y="109" font-size="14" fill="#4267a8" text-anchor="middle">用于选参</text><rect x="161.33333333333334" y="30" width="70.66666666666667" height="45" rx="5" fill="#765497"/><text x="196.66666666666669" y="59" font-size="17" fill="#fff" text-anchor="middle">测试</text><text x="196.66666666666669" y="109" font-size="14" fill="#765497" text-anchor="middle">留出评价</text></g><path d="M310.0,176.0 L328.0,176.0 L322.0,170.0 L328.0,176.0 L322.0,182.0" fill="none" stroke="#4267a8" stroke-width="2"/><rect x="336" y="50" width="288" height="260" rx="8" fill="#f2f6fc" stroke="#dce5e8"/><text x="352" y="77" font-size="17" fill="#4267a8" text-anchor="start" font-weight="600">执行本步</text><text x="352" y="103" font-size="16" fill="#293b3b" text-anchor="start">比较验证集误差</text>